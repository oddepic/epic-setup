name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compute version from tag
        id: version
        shell: pwsh
        run: |
          # On a tag push (v1.2.3-test), use the tag as the version so the UI
          # always shows exactly what was released. On manual dispatch, fall
          # back to the csproj <Version>.
          $version = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $args = @(
            'src/epic-setup/epic-setup.csproj',
            '-c', 'Release',
            '-r', 'win-x64',
            '--self-contained', 'true',
            '-p:PublishSingleFile=true',
            '-p:EnableCompressionInSingleFile=false',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:DebugType=none',
            '-p:SatelliteResourceLanguages=en'
          )
          $version = "${{ steps.version.outputs.VERSION }}"
          if ($version) { $args += "-p:Version=$version" }
          $args += @('-o', 'dist')
          dotnet publish @args

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/epic-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ endsWith(github.ref_name, '-test') }}
